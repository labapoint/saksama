<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <style>
    .t{font-size:28px;font-weight:700;fill:#0F172A}
    .st{font-size:15px;fill:#475569}
    .z{font-size:15px;font-weight:700}
    .h{font-size:20px;font-weight:700;fill:#0F172A}
    .r{font-size:15px;fill:#475569}
    .a{font-size:14px;fill:#334155}
    .ao{font-size:14px;fill:#92400E;font-weight:700}
    .bd{font-size:13px;font-weight:700;fill:#FFFFFF}
    .lg{font-size:14px;fill:#334155}
    .ln{stroke:#334155;stroke-width:2;fill:none}
    .lno{stroke:#B45309;stroke-width:3;fill:none}
    .lnr{stroke:#DC2626;stroke-width:2;stroke-dasharray:7 5;fill:none}
  </style>

  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <text x="40" y="52" class="t">Saksama: arsitektur dan batas kepercayaan</text>
  <text x="40" y="80" class="st">Agent menyusun rencana, manusia memutuskan, kode menjalankan dan mencatat. Semua data fiktif, eksekusi hanya simulasi.</text>

  <text x="40" y="132" class="z" fill="#1D4ED8">MANUSIA</text>
  <rect x="40" y="150" width="250" height="150" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="60" y="186" class="h">Owner dan staf</text>
  <text x="60" y="212" class="r">Memberi perintah dan izin</text>
  <text x="60" y="250" class="a">Lewat WorkBuddy desktop</text>
  <text x="60" y="272" class="a">atau Slack dari HP</text>

  <rect x="330" y="112" width="860" height="560" rx="18" fill="#F8FAFC" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="12 7"/>
  <rect x="350" y="100" width="260" height="26" fill="#FFFFFF"/>
  <text x="358" y="119" class="z" fill="#1D4ED8">BATAS 1 · Sandbox WorkBuddy</text>

  <rect x="370" y="150" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="390" y="186" class="h">Agent (LLM)</text>
  <text x="390" y="212" class="r">Memahami, bertanya,</text>
  <text x="390" y="232" class="r">menyampaikan</text>
  <text x="390" y="270" class="a">Persona + Skill asisten-owner</text>

  <rect x="820" y="150" width="340" height="150" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="3"/>
  <text x="840" y="186" class="h">catat.py</text>
  <text x="840" y="212" class="r">BATAS 2 · gerbang persetujuan</text>
  <text x="840" y="250" class="a">Kode yang memutuskan</text>
  <text x="840" y="272" class="a">sah atau tidaknya persetujuan</text>

  <rect x="370" y="380" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="390" y="416" class="h">cek_aturan.py</text>
  <text x="390" y="442" class="r">Hitungan pasti, tanpa AI</text>
  <text x="390" y="466" class="a">Stok · HPP · jadwal · izin</text>

  <rect x="370" y="540" width="300" height="100" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="390" y="576" class="h">data/</text>
  <text x="390" y="602" class="r">CSV fiktif, hanya dibaca</text>

  <rect x="820" y="420" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="840" y="456" class="h">Hasil dan jejak audit</text>
  <text x="840" y="482" class="r">Hanya ditulis catat.py</text>
  <text x="840" y="520" class="a">outbox/ · rencana/ · log.csv</text>

  <text x="1230" y="132" class="z" fill="#15803D">BATAS 3 · DI LUAR SANDBOX</text>
  <rect x="1230" y="150" width="330" height="150" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="1250" y="186" class="h">Kunci tanda tangan</text>
  <text x="1250" y="212" class="r">Dipegang manusia,</text>
  <text x="1250" y="232" class="r">agent tidak punya akses</text>

  <rect x="1230" y="420" width="330" height="140" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="1250" y="456" class="h">Jendela pantau</text>
  <text x="1250" y="482" class="r">Hanya membaca,</text>
  <text x="1250" y="502" class="r">tidak bisa memerintah</text>

  <path class="ln" d="M290 205 L368 205" marker-end="url(#ah)"/>
  <text x="300" y="196" class="a">pesan</text>
  <path class="ln" d="M368 255 L292 255" marker-end="url(#ah)"/>
  <text x="296" y="276" class="a">konfirmasi</text>

  <path class="lno" d="M670 205 L818 205" marker-end="url(#aho)"/>
  <text x="682" y="195" class="ao">rencana, balasan</text>
  <path class="ln" d="M818 255 L672 255" marker-end="url(#ah)"/>
  <text x="682" y="276" class="a">layar konfirmasi</text>

  <path class="ln" d="M870 300 L672 410" marker-end="url(#ah)"/>
  <text x="760" y="345" class="a">cek</text>
  <path class="ln" d="M520 490 L520 538" marker-end="url(#ah)"/>
  <text x="530" y="520" class="a">baca</text>

  <path class="lno" d="M990 300 L990 418" marker-end="url(#aho)"/>
  <text x="1002" y="366" class="ao">jalankan, catat</text>

  <path class="ln" d="M1160 225 L1228 225" marker-end="url(#ah)"/>
  <text x="1172" y="215" class="a">kunci</text>
  <path class="ln" d="M1160 490 L1228 490" marker-end="url(#ah)"/>
  <text x="1176" y="480" class="a">baca</text>

  <path class="lnr" d="M378 300 C340 380 340 520 368 575" marker-end="url(#ahm)"/>
  <circle cx="345" cy="440" r="22" fill="#DC2626"/>
  <text x="345" y="445" class="bd" text-anchor="middle">T25</text>
  <circle cx="670" cy="150" r="22" fill="#DC2626"/>
  <text x="670" y="155" class="bd" text-anchor="middle">T17</text>
  <circle cx="290" cy="150" r="22" fill="#DC2626"/>
  <text x="290" y="155" class="bd" text-anchor="middle">T48</text>

  <text x="40" y="722" class="z" fill="#0F172A">KALAU JADI FITUR LABAPOINT: agent tidak pernah memegang file data atau kunci</text>
  <rect x="40" y="740" width="320" height="64" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="60" y="768" class="a" font-weight="700">Owner dan staf</text>
  <text x="60" y="790" class="a">Identitas dari login</text>
  <rect x="440" y="740" width="320" height="64" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <text x="460" y="768" class="a" font-weight="700">Asisten (LLM)</text>
  <text x="460" y="790" class="a">Hanya memanggil API</text>
  <rect x="840" y="740" width="320" height="64" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <text x="860" y="768" class="a" font-weight="700">Server (Edge Function)</text>
  <text x="860" y="790" class="a">Gerbang, tanda tangan, cek ulang</text>
  <rect x="1240" y="740" width="320" height="64" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="1260" y="768" class="a" font-weight="700">Database Labapoint</text>
  <text x="1260" y="790" class="a">Row Level Security, audit_log</text>
  <path class="ln" d="M360 772 L438 772" marker-end="url(#ah)"/>
  <path class="ln" d="M760 772 L838 772" marker-end="url(#ah)"/>
  <path class="ln" d="M1160 772 L1238 772" marker-end="url(#ah)"/>

  <line x1="40" y1="850" x2="90" y2="850" class="ln"/>
  <text x="100" y="855" class="lg">alur biasa</text>
  <line x1="200" y1="850" x2="250" y2="850" class="lno"/>
  <text x="260" y="855" class="lg">lewat gerbang persetujuan (ditegakkan kode)</text>
  <rect x="610" y="839" width="22" height="22" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="642" y="855" class="lg">batas kepercayaan</text>

  <rect x="40" y="878" width="1520" height="96" rx="12" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="62" y="908" class="lg" font-weight="700" style="fill:#B91C1C">Celah yang kami temukan saat uji:</text>
  <text x="312" y="908" class="lg"><tspan font-weight="700" fill="#B91C1C">T25</tspan>  agent masih bisa membaca CSV langsung (batas utama demo)</text>
  <text x="312" y="931" class="lg"><tspan font-weight="700" fill="#B91C1C">T17</tspan>  saat script error, agent mematikan shim sandbox</text>
  <text x="312" y="954" class="lg"><tspan font-weight="700" fill="#B91C1C">T48</tspan>  lewat Slack, permintaan berulang dijawab dari ingatan tanpa gerbang. Rincian di accountability sheet.</text>
</svg>
